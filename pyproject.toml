[project]
name = "videocodigo"
version = "0.1.0"
description = "Backend para generar videos que explican código línea por línea: Manim + VoiceStudio."
requires-python = ">=3.12"
dependencies = [
    "manim>=0.19",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "edge-tts>=7.0",
    "pygments>=2.17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["fastapi==0.159.1", "uvicorn==0.54.0", "python-multipart==0.0.32", "psutil==7.2.2", "httpx==0.28.1"]

[project.scripts]
videocodigo = "videocodigo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]
